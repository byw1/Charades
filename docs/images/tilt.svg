<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
<rect width="960" height="560" rx="24" fill="#0A0A0D"/>
<text x="40" y="52" fill="#FFE500" font-size="15" font-weight="800" letter-spacing="2">HOW TILT IS READ</text>
<text x="40" y="84" fill="#fff" font-size="25" font-weight="800">Angles are measured from how <tspan fill="#FFE500">you</tspan> hold the phone, not from upright.</text>
<path d="M120,310 L120.0,135.0 A175,175 0 0 1 271.6,222.5 Z" fill="#FF6B2C" opacity="1"/>
<path d="M120,310 L271.6,397.5 A175,175 0 0 1 120.0,485.0 Z" fill="#2EE86F" opacity="1"/>
<path d="M120,310 L271.6,222.5 A175,175 0 0 1 289.0,264.7 Z" fill="#2a2a33" opacity="1"/>
<path d="M120,310 L289.0,355.3 A175,175 0 0 1 271.6,397.5 Z" fill="#2a2a33" opacity="1"/>
<path d="M120,310 L289.0,264.7 A175,175 0 0 1 289.0,355.3 Z" fill="#9B5CFF" opacity="1"/>
<circle cx="120" cy="310" r="62" fill="#0A0A0D"/>
<text x="194.2" y="191.3" fill="#0A0A0D" font-size="21" font-weight="800" text-anchor="middle" dominant-baseline="middle">PASS</text>
<text x="178.3" y="216.7" fill="#0A0A0D" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle">tip up</text>
<text x="179.4" y="405.0" fill="#0A0A0D" font-size="21" font-weight="800" text-anchor="middle" dominant-baseline="middle">GOT IT</text>
<text x="195.2" y="430.4" fill="#0A0A0D" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle">tip down</text>
<text x="240.0" y="310.0" fill="#fff" font-size="15" font-weight="800" text-anchor="middle" dominant-baseline="middle">resting</text>
<text x="292.3" y="210.5" fill="#FF6B2C" font-size="14" font-weight="800" text-anchor="middle" dominant-baseline="middle">−30°</text>
<text x="292.3" y="409.5" fill="#2EE86F" font-size="14" font-weight="800" text-anchor="middle" dominant-baseline="middle">+30°</text>
<text x="312.2" y="258.5" fill="#9B5CFF" font-size="13" font-weight="800" text-anchor="middle" dominant-baseline="middle">−15°</text>
<text x="312.2" y="361.5" fill="#9B5CFF" font-size="13" font-weight="800" text-anchor="middle" dominant-baseline="middle">+15°</text>
<rect x="111" y="276" width="18" height="68" rx="6" fill="#fff"/>
<circle cx="440" cy="144" r="15" fill="#9B5CFF"/><text x="440" y="145" fill="#0A0A0D" font-size="15" font-weight="800" text-anchor="middle" dominant-baseline="middle">1</text>
<text x="468" y="150" fill="#fff" font-size="18" font-weight="800">Learns how you hold it</text>
<text x="468" y="174" fill="#b9b9c4" font-size="14.5" font-weight="500">Steady for 250 ms, within 60° of upright: that angle</text>
<text x="468" y="194" fill="#b9b9c4" font-size="14.5" font-weight="500">becomes “resting”.</text>
<circle cx="440" cy="234" r="15" fill="#2EE86F"/><text x="440" y="235" fill="#0A0A0D" font-size="15" font-weight="800" text-anchor="middle" dominant-baseline="middle">2</text>
<text x="468" y="240" fill="#fff" font-size="18" font-weight="800">A clear tip counts</text>
<text x="468" y="264" fill="#b9b9c4" font-size="14.5" font-weight="500">30° past resting, held for 70 ms. A quick nod is enough.</text>
<circle cx="440" cy="304" r="15" fill="#FF6B2C"/><text x="440" y="305" fill="#0A0A0D" font-size="15" font-weight="800" text-anchor="middle" dominant-baseline="middle">3</text>
<text x="468" y="310" fill="#fff" font-size="18" font-weight="800">One tip, one card</text>
<text x="468" y="334" fill="#b9b9c4" font-size="14.5" font-weight="500">It has to come back within 15° of resting for 100 ms</text>
<text x="468" y="354" fill="#b9b9c4" font-size="14.5" font-weight="500">before the next tip counts.</text>
<circle cx="440" cy="394" r="15" fill="#FFE500"/><text x="440" y="395" fill="#0A0A0D" font-size="15" font-weight="800" text-anchor="middle" dominant-baseline="middle">4</text>
<text x="468" y="400" fill="#fff" font-size="18" font-weight="800">Slow drift is not a gesture</text>
<text x="468" y="424" fill="#b9b9c4" font-size="14.5" font-weight="500">While held, resting slowly follows the phone, so sinking</text>
<text x="468" y="444" fill="#b9b9c4" font-size="14.5" font-weight="500">lower over a round never turns into a pass.</text>
<text x="40" y="534" fill="#6c6c78" font-size="12.5" font-weight="600">Gravity from the fused motion sensor, pitch = asin(z / |g|). Same on iPhone and Android, upright or sideways. See src/game/tilt.ts.</text>
</svg>