<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<script src="kit.js"></script>
</head>
<body>
<script>
// App Store screenshots, 1320 x 2868 (6.9" iPhone). ?n=1..7 picks the panel.
const W = 1320, H = 2868;
const S = (name) => `../../store/screens/${name}.png`;
const n = Number(new URLSearchParams(location.search).get('n') || 1);

/** A curved arrow, drawn as SVG, for tilt motion. */
function arc({ x, y, w, h, colour, flip = false, rot = 0, stroke = 22 }, parent) {
  const svg = el('div', { position: 'absolute', left: `${x}px`, top: `${y}px`, width: `${w}px`, height: `${h}px`, transform: `rotate(${rot}deg) ${flip ? 'scaleY(-1)' : ''}` }, parent);
  svg.innerHTML = `<svg viewBox="0 0 200 120" width="100%" height="100%" style="overflow:visible"><path d="M20 100 Q 100 -10 180 70" fill="none" stroke="${colour}" stroke-width="${stroke / 4}" stroke-linecap="round"/><path d="M160 46 L183 73 L150 80" fill="none" stroke="${colour}" stroke-width="${stroke / 4}" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  return svg;
}

const panels = {
  // 1. What it is.
  async 1() {
    const { root, world } = stage({ w: W, h: H, bg: C.yellow });
    backdrop(world, { base: `linear-gradient(180deg, ${C.yellow} 0%, #FFD400 100%)`, blobs: [{ x: -260, y: 1900, r: 520, c: '#fff', o: 0.22 }, { x: 900, y: 700, r: 420, c: '#fff', o: 0.18 }] });
    headline(world, { kicker: 'The forehead party game', title: 'Guess the word<br>on your head.', top: 170, size: 156 });
    await phone({ src: S('14-card-0'), w: 820, x: 270, y: 840, rx: 8, ry: -16, rz: -5, z: 40 }, world);
    arc({ x: 880, y: 960, w: 360, h: 220, colour: C.ink, rot: 20 }, world);
    pill({ text: '⬇ Tip down: got it', bg: C.green, fg: C.ink, size: 60, x: 640, y: 2230, rot: -4, z: 460 }, world);
    pill({ text: '⬆ Tip up: pass', bg: C.orange, fg: C.ink, size: 60, x: 80, y: 1060, rot: 5, z: 460 }, world);
    dex({ mood: 'excited', size: 440, x: 70, y: 2180, rot: -10, z: 500 }, world);
    sticker({ emoji: '😂', size: 190, x: 1010, y: 1760, rot: 12, z: 420 }, world);
    sticker({ emoji: '🎉', size: 150, x: 90, y: 1560, rot: -14, z: 420 }, world);
  },

  // 2. How you answer.
  async 2() {
    const { root, world } = stage({ w: W, h: H, bg: C.ink });
    backdrop(world, { base: C.ink, glow: 'rgba(46,232,111,.28)', blobs: [{ x: 700, y: 1500, r: 640, c: C.orange, o: 0.16 }, { x: -300, y: 1300, r: 620, c: C.green, o: 0.16 }] });
    headline(world, { kicker: 'No buttons. Just tilt.', kickerColour: C.yellow, title: 'Tip down to score.<br>Tip up to skip.', colour: '#fff', top: 170, size: 128 });
    await phone({ src: S('15-flash-2-pass'), w: 640, x: 620, y: 1050, rx: -26, ry: -18, rz: 9, z: -120 }, world);
    await phone({ src: S('15-flash-0-got'), w: 700, x: 110, y: 1150, rx: 30, ry: 16, rz: -8, z: 80 }, world);
    confetti({ n: 46, seed: 4, x: 0, y: 900, w: W, h: 1500, size: 40 }, world);
    pill({ text: '+1 point', bg: C.green, fg: C.ink, size: 64, x: 120, y: 2470, rot: -6, z: 500 }, world);
    pill({ text: 'Skip!', bg: C.orange, fg: C.ink, size: 64, x: 860, y: 1000, rot: 7, z: 500 }, world);
  },

  // 3. Make your own decks.
  async 3() {
    const { root, world } = stage({ w: W, h: H, bg: C.purple });
    backdrop(world, { base: `linear-gradient(180deg, ${C.purple} 0%, ${C.purpleDeep} 100%)`, glow: 'rgba(255,255,255,.25)', blobs: [{ x: 820, y: 1900, r: 560, c: C.pink, o: 0.28 }] });
    headline(world, { kicker: 'Make your own decks', kickerColour: C.yellow, title: 'Cards about<br>your friends.', sub: 'Inside jokes, roommates, the group chat.<br>Type them in, play in seconds.', colour: '#fff', top: 170, size: 156 });
    await phone({ src: S('07-deck-saved'), w: 780, x: 270, y: 1150, rx: 6, ry: 18, rz: 4 }, world);
    card3d({ text: 'Roomba named Kevin', bg: C.yellow, w: 470, x: 40, y: 1260, rx: 12, ry: 28, rz: -12, z: 560 }, world);
    card3d({ text: 'The 3am fire alarm', bg: C.pink, fg: '#fff', w: 420, x: 800, y: 1700, rx: -8, ry: -26, rz: 10, z: 600 }, world);
    card3d({ text: 'Our landlord Steve', bg: C.blue, fg: C.ink, w: 400, x: 100, y: 2200, rx: 18, ry: 22, rz: 7, z: 640 }, world);
    sticker({ emoji: '🏠', size: 170, x: 1060, y: 1130, rot: 10, z: 500 }, world);
  },

  // 4. Lots to play.
  async 4() {
    const { root, world } = stage({ w: W, h: H, bg: C.pink });
    backdrop(world, { base: `linear-gradient(180deg, ${C.pink} 0%, ${C.pinkDeep} 100%)`, blobs: [{ x: -300, y: 1500, r: 600, c: C.yellow, o: 0.2 }] });
    headline(world, { kicker: '17 decks built in', kickerColour: C.yellow, title: '1,700 cards,<br>ready to go.', sub: 'From 2010s Throwback to Gen Z Slang.', colour: '#fff', top: 170, size: 156 });
    await phone({ src: S('03-decks'), w: 780, x: 270, y: 1130, rx: 6, ry: -18, rz: -4 }, world);
    card3d({ text: 'Rizz', bg: '#fff', w: 360, x: 20, y: 1560, rx: 10, ry: 30, rz: -10, z: 560 }, world);
    card3d({ text: 'Capybara', bg: C.green, w: 380, x: 850, y: 1500, rx: -10, ry: -28, rz: 9, z: 600 }, world);
    card3d({ text: 'Stepping on a Lego', bg: C.yellow, w: 420, x: 90, y: 2180, rx: 16, ry: 20, rz: 6, z: 620 }, world);
    card3d({ text: 'Sloth', bg: C.blue, w: 340, x: 860, y: 2330, rx: -14, ry: -22, rz: -8, z: 580 }, world);
  },

  // 5. Your rules.
  async 5() {
    const { root, world } = stage({ w: W, h: H, bg: C.blue });
    backdrop(world, { base: `linear-gradient(180deg, ${C.blue} 0%, ${C.blueDeep} 100%)`, blobs: [{ x: 760, y: 2000, r: 560, c: C.yellow, o: 0.18 }] });
    headline(world, { kicker: 'Play it your way', title: 'Teams, timers<br>and house rules.', colour: C.ink, top: 170, size: 150 });
    await phone({ src: S('11-rules'), w: 780, x: 270, y: 1000, rx: 6, ry: 16, rz: 4 }, world);
    pill({ text: '⏱ 30 · 60 · 90s', bg: C.yellow, fg: C.ink, size: 60, x: 80, y: 1180, rot: -6, z: 520 }, world);
    pill({ text: '🚫 Banned words', bg: '#fff', fg: C.ink, size: 60, x: 600, y: 1560, rot: 5, z: 540 }, world);
    pill({ text: '♾ Endless mode', bg: C.pink, fg: '#fff', size: 60, x: 100, y: 2050, rot: 4, z: 560 }, world);
    pill({ text: '🌀 Chaos twists', bg: C.green, fg: C.ink, size: 60, x: 620, y: 2380, rot: -5, z: 540 }, world);
    dex({ mood: 'wink', size: 330, x: 960, y: 820, rot: 12, z: 500 }, world);
  },

  // 6. Bragging rights.
  async 6() {
    const { root, world } = stage({ w: W, h: H, bg: C.ink });
    backdrop(world, { base: C.ink, glow: 'rgba(255,229,0,.22)', blobs: [{ x: 300, y: 1500, r: 600, c: C.purple, o: 0.22 }] });
    headline(world, { kicker: 'Every round, scored', kickerColour: C.yellow, title: 'Find out who’s<br>the legend.', colour: '#fff', top: 170, size: 150 });
    await phone({ src: S('18-standings'), w: 640, x: 600, y: 1000, rx: 4, ry: -24, rz: 6, z: -160 }, world);
    await phone({ src: S('17-recap'), w: 720, x: 110, y: 1120, rx: 6, ry: 18, rz: -4, z: 60 }, world);
    confetti({ n: 60, seed: 11, x: 0, y: 760, w: W, h: 2000, size: 38 }, world);
    sticker({ emoji: '🏆', size: 220, x: 900, y: 2250, rot: 10, z: 560 }, world);
    dex({ mood: 'excited', size: 380, x: 90, y: 2250, rot: -8, z: 580 }, world);
  },

  // 7. Offline.
  async 7() {
    const { root, world } = stage({ w: W, h: H, bg: C.orange });
    backdrop(world, { base: `linear-gradient(180deg, ${C.orange} 0%, ${C.orangeDeep} 100%)`, blobs: [{ x: -260, y: 1800, r: 600, c: C.yellow, o: 0.24 }] });
    headline(world, { kicker: 'Road trips, dorms, dead zones', title: 'No Wi-Fi?<br>No problem.', sub: 'Plays fully offline. No accounts, no ads.', colour: C.ink, top: 170, size: 156 });
    await phone({ src: S('01-play'), w: 780, x: 270, y: 1130, rx: 6, ry: -16, rz: -4 }, world);
    sticker({ emoji: '✈️', size: 210, x: 960, y: 1180, rot: 14, z: 540 }, world);
    sticker({ emoji: '🏕️', size: 180, x: 70, y: 1600, rot: -12, z: 520 }, world);
    dex({ mood: 'happy', size: 380, x: 820, y: 2220, rot: 8, z: 580 }, world);
  },
};

(async () => {
  await document.fonts.ready;
  await panels[n]();
  await document.fonts.ready;
  await new Promise((r) => setTimeout(r, 300));
  document.title = 'ready';
})();
</script>
</body>
</html>
